[build-system]
requires = ["setuptools>=68", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "passline"
version = "0.1.0"
description = "Multi-agent subtitle QC and repair system for streaming delivery workflows"
requires-python = ">=3.12"
dependencies = [
    "google-adk==2.7.1",
    "google-genai>=2.19,<3",
    "pydantic>=2.12,<3",
    "python-dotenv>=1,<2",
]

[project.scripts]
passline = "passline.__main__:main"

[tool.setuptools.packages.find]
where = ["."]
include = ["passline*"]

[tool.pytest.ini_options]
testpaths = ["tests"]
python_files = ["test_*.py"]
python_functions = ["test_*"]
