[build-system]
requires = ["setuptools>=68", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "passline"
version = "0.1.0"
description = "Multi-agent subtitle QC and repair system for streaming delivery workflows"
requires-python = ">=3.12"
dependencies = [
    "google-adk==2.7.1",
    "google-genai>=2.19,<3",
    "pydantic>=2.12,<3",
    "python-dotenv>=1,<2",
    "fastapi>=0.133,<1",
    "uvicorn>=0.30,<1",
    "python-multipart>=0.0.9,<1",
]

[project.optional-dependencies]
dev = [
    "pytest>=9,<10",
]

[project.scripts]
passline           = "passline.__main__:main"
passline-dashboard = "passline.dashboard.app:run"

[tool.setuptools.packages.find]
where = ["."]
include = ["passline*"]

[tool.pytest.ini_options]
testpaths = ["tests"]
python_files = ["test_*.py"]
python_functions = ["test_*"]
